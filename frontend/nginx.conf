# nginx: servidor estático del frontend + proxy inverso del API.
#
# Flujo de una solicitud de API desde el navegador:
#   navegador -> http://localhost:8080/api/v1/flights
#            -> nginx (servicio "frontend", puerto 8080)
#            -> proxy inverso -> http://backend:8000/api/v1/flights
#            -> FastAPI responde -> nginx devuelve al navegador
#
# El navegador solo conoce un origen (localhost:8080), por lo que
# no necesita resolver el nombre interno "backend" y no se producen
# problemas de CORS en el despliegue con Docker Compose.

worker_processes auto;

# Sin privilegios de root: el contenedor se ejecuta como usuario
# "nginx" (UID 101), por eso el PID y las rutas temporales van a /tmp.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 30;

    # Rutas temporales escribibles sin root.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Proxy inverso: todo lo que empiece con /api/ se reenvía
        # al servicio backend de la red interna de Docker.
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        # Archivos estáticos con caché breve.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
